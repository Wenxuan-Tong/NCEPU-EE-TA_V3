name: Deploy Hugo to GitHub Pages

on:
  push:
    branches: [ dev-now ]     # ← 你当前推送的分支
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true        # 主题是子模块时必须
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.150.1' # 用你本地的版本，extended 主题要开启
          extended: true

      - name: Build site
        env:
          HUGO_ENV: production
        run: |
          rm -rf public
          hugo --minify --baseURL "https://wenxuan-tong.github.io/NCEPU-EE-TA_V3/"
          touch public/.nojekyll   # 防止 Jekyll 处理，保留下划线等路径

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
