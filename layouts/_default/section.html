{{ define "main" }}
  <div class="container">
    <div class="row mt-4">
      <aside class="col-lg-3">
        <div class="hb-navbox sidebar-sticky">
          {{/* 固定根：teaching-awards */}}
          {{ $root := site.GetPage "section" "EE-awards/teaching-awards" }}
          {{ partial "nav-tree.html" (dict "ctx" . "node" $root "level" 1 "max" 4 "showRoot" false) }}
        </div>
      </aside>

      <main class="col-lg-9">
        <h1>{{ .Title }}</h1>
        {{ .Content }}
        {{/* 可选：列表/卡片等内容块 */}}
      </main>
    </div>
  </div>
{{ end }}
